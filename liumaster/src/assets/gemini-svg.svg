<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="100%" height="100%">
  <!-- 
    INZOOMAD & TRANSPARENT SVG-PROFILBILD
    - Bakgrund: Helt transparent (ingen utfyllnad)
    - Färg: Solid vit (#FFFFFF)
    - Inzoomning: Koordinaterna anpassade så att axlarna slutar vid nedre kanten (y=440)
  -->

  <g fill="#FFFFFF">
    <!-- Axlar och bål (sträckta till botten av bildvyn) -->
    <path d="M 60 440 C 60 330, 160 290, 250 290 C 340 290, 440 330, 440 440 Z" />
    
    <!-- Huvud (förskjutet uppåt i den tajtare vyn) -->
    <circle cx="250" cy="145" r="95" />
    
    <!-- Hals -->
    <path d="M 210 220 L 290 220 L 295 300 L 205 300 Z" />
  </g>
</svg>